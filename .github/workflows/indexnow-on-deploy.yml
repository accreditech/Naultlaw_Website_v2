name: IndexNow on production deploy

# Fires on every push to master. Computes which sitemap URLs were
# affected by the commit range, waits ~90s for the Vercel production
# deploy to land, then POSTs the changed URLs to /api/indexnow. Pairs
# with the weekly Vercel Cron in vercel.json (full-sitemap safety net).
#
# Requires repo secret CRON_SECRET — must match the Production env var
# of the same name in Vercel.

on:
  push:
    branches: [master]

# A second push during the 90s wait window cancels the prior run rather
# than racing two submissions. The cron safety net catches anything we
# might miss this way.
concurrency:
  group: indexnow-on-deploy
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo with parent commit
        uses: actions/checkout@v4
        with:
          # We need github.event.before reachable for the git-diff step.
          # 2 is the minimum that lets us diff against the parent commit
          # for a normal push; for a force-push or first push the
          # mapper falls back to "submit nothing" (the cron handles it).
          fetch-depth: 2

      - name: Compute changed sitemap URLs
        id: urls
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node .github/workflows/indexnow-compute-urls.mjs

      - name: Wait for Vercel production deploy to land
        if: steps.urls.outputs.url_count != '0'
        # Vercel master->production deploys typically land in 60-90s.
        # If a URL isn't live yet, IndexNow's key-verification still
        # succeeds (the key file is static and was already deployed in
        # PR #23); the submitted URL is just briefly 404 — Bing
        # re-fetches later, so the impact is "first crawl is delayed by
        # one cycle," not "submission fails." 90s is conservative.
        run: sleep 90

      - name: Submit changed URLs to IndexNow
        if: steps.urls.outputs.url_count != '0'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL_JSON: ${{ steps.urls.outputs.url_json }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Repo secret CRON_SECRET is not set; cannot authenticate to /api/indexnow."
            exit 1
          fi
          echo "Submitting ${{ steps.urls.outputs.url_count }} URL(s) to https://naultlaw.com/api/indexnow"
          # Surface response body for the Action log either way.
          http_status=$(curl -sS -o /tmp/indexnow-resp.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data "${URL_JSON}" \
            https://naultlaw.com/api/indexnow)
          echo "HTTP ${http_status}"
          cat /tmp/indexnow-resp.json
          echo
          if [ "${http_status}" != "200" ]; then
            echo "::error::IndexNow trigger returned HTTP ${http_status}"
            exit 1
          fi

      - name: No URLs to submit (commit touched no sitemap-mapped files)
        if: steps.urls.outputs.url_count == '0'
        run: |
          echo "Commit range ${{ github.event.before }}..${{ github.sha }} touched no files that map to a sitemap URL. Skipping IndexNow submission. The weekly Vercel Cron will resubmit the full sitemap as a safety net."
